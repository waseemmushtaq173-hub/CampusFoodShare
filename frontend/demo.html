<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CampusFoodShare | Live demo</title>
<style>
  :root { --bg:#f4f1ea; --ink:#1f2a22; --green:#1f6b4a; --line:#d9ddd5; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a16; --ink:#e8efe9; --line:#2b3a31; --card:#1b231e; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 15px; margin: 0; }
  header p { margin: 0; font-size: 12px; opacity: .75; flex: 1 1 260px; }
  label { font-size: 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
  select, a.open { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); text-decoration: none; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; min-height: 0; }
  .pane { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); min-height: 0; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 700; }
  .pane-head small { font-weight: 400; opacity: .7; }
  iframe { flex: 1; border: 0; width: 100%; min-height: 0; background: #fff; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-auto-rows: 70vh; overflow: auto; } }
</style>
</head>
<body>
<header>
  <h1>CampusFoodShare: live demo</h1>
  <p>Post food on the left. Watch the request, the database counts and the live log change on the right. Both talk to the same backend at the same time.</p>
  <label>Left <select id="left"><option value="/">Public website</option><option value="/app/?signin=1">Platform (sign in)</option></select></label>
  <label>Right <select id="right"><option value="/system.html">Backend console</option><option value="/">Public website</option><option value="/app/?signin=1">Platform (sign in)</option></select></label>
</header>
<main>
  <section class="pane"><div class="pane-head"><span>Frontend <small id="lname">Public website</small></span><a class="open" id="lopen" target="_blank" rel="noopener">Open in its own tab</a></div><iframe id="lf" title="Frontend"></iframe></section>
  <section class="pane"><div class="pane-head"><span>Backend <small id="rname">Backend console</small></span><a class="open" id="ropen" target="_blank" rel="noopener">Open in its own tab</a></div><iframe id="rf" title="Backend"></iframe></section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function wire(sel, frame, open, name) {
    const go = () => { const v = $(sel).value; $(frame).src = v; $(open).href = v; $(name).textContent = $(sel).selectedOptions[0].textContent; };
    $(sel).addEventListener('change', go); go();
  }
  wire('left', 'lf', 'lopen', 'lname');
  wire('right', 'rf', 'ropen', 'rname');
</script>
</body>
</html>

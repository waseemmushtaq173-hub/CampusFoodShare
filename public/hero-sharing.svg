    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/><stop offset="0.5" stop-color="#ffc857" stop-opacity="0.85"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset="1" stop-color="#1a1238"/></linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>

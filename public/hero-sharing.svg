    <path d="M706 250 c-6 -8 -18 -2 -10 8 l10 9 l10 -9 c8 -10 -4 -16 -10 -8z" transform="scale(1.1) translate(-60 -22)"/>
    <path d="M800 236 c-5 -7 -15 -2 -8 6 l8 8 l8 -8 c7 -8 -3 -13 -8 -6z"/>
    <path d="M920 250 c-5 -7 -15 -2 -8 6 l8 8 l8 -8 c7 -8 -3 -13 -8 -6z" fill="#ffd93d"/>
